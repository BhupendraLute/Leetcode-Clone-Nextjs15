services:
  postgres:
    image: postgres:15
    container_name: postgres15_db
    environment:
      - POSTGRES_DB=leetcode
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    ports:
      - "5433:5432"
    volumes:
      - leetcode_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leetcode"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  leetcode_db_data:
